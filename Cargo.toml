[package]
name = "xad-rs"
version = "7.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Sercan Atalik"]
description = "Exact automatic differentiation for Rust — forward-mode, reverse-mode, first- and second-order, with a unified `Real` trait for mode-agnostic numerical code"
license = "MIT"
repository = "https://github.com/sercanatalik/xad-rs"
homepage = "https://github.com/sercanatalik/xad-rs"
documentation = "https://docs.rs/xad-rs"
readme = "README.md"
keywords = ["autodiff", "derivatives", "adjoint", "dual-numbers", "quant"]
categories = ["mathematics", "science"]
exclude = [
    "/.github/",
    "/target/",
    "/docs/",
    "*.lock",
]

[dependencies]
num-traits = "0.2"
ndarray = "0.16"
rayon = "1"

[dev-dependencies]
approx = "0.5"
# Only used by the table-stamped uniformity tests in `src/elementaries.rs`,
# which live in a `#[cfg(test)]` module — not needed to build the crate.
paste = "1"


# Tuned release profile for an operator-heavy, monomorphized AD library.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
