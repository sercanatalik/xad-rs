# The documentation site, built with mdBook and published to GitHub Pages by
# .github/workflows/pages.yml. The theory chapters under theory/ are the
# source of truth; index.md is the landing page; theme/ holds the site's look.
#
#     mdbook serve docs        # local preview at http://localhost:3000
#     mdbook build docs        # writes target/book

[book]
title = "xad-rs"
authors = ["Sercan Atalik"]
description = "Exact automatic differentiation for Rust: forward and reverse mode, first and second order, behind one mode-agnostic Real trait."
language = "en"
src = "."

[build]
build-dir = "../target/book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
site-url = "/xad-rs/"
git-repository-url = "https://github.com/sercanatalik/xad-rs"
edit-url-template = "https://github.com/sercanatalik/xad-rs/edit/main/docs/{path}"
additional-css = ["theme/xad.css"]
additional-js = ["theme/xad.js"]

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true

[output.html.print]
enable = false

[output.html.fold]
enable = false
